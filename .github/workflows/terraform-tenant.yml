name: Terraform Apply Auth0 tenant

on:
  push:
    branches:
      - main


jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
      

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3 

      - name: Terraform init
        run: terraform init
      
      - name: Terraform plan
        run: terraform plan -target=module.auth0_tenant -auto-approve

      - name: Terraform Apply
        run: terraform apply -target=module.auth0_tenant -auto-approve
